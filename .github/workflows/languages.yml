name: Generate languages card

on:
  schedule:
    - cron: "0 */12 * * *"  # Corrigido para o formato padrão
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create dist directory
        run: mkdir -p dist

      - name: Generate languages.svg
        run: |
          curl -L "https://github-readme-stats.vercel.app/api/top-langs?username=${{ github.repository_owner }}&locale=en&hide_title=false&layout=compact&card_width=320&langs_count=5&theme=dracula&hide_border=false" > dist/languages.svg

      - name: Push languages.svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: languages-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
